[package]
name = "quick-takeapart"
version = "2.1.0"
description = "Quick-TakeApart desktop shell"
authors = ["Quick-TakeApart"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "quick_takeapart_lib"
path = "src/lib.rs"

[[bin]]
name = "quick-takeapart"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
