<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Quick-TakeApart</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0f1116; color: #d7dae0;
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  .mark { font-size: 20px; letter-spacing: .18em; color: #e8ecf3; text-transform: uppercase; }
  .bar { width: 220px; height: 3px; background: #1d2430; border-radius: 2px; overflow: hidden; }
  .bar span {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #4b7bec, #7ee0c0);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  #status { color: #8b93a3; font-size: 12px; max-width: 440px; text-align: center; padding: 0 16px; }
  #status.error { color: #ff8a8a; }
</style>
</head>
<body>
  <div class="mark">Quick-TakeApart</div>
  <div class="bar"><span></span></div>
  <div id="status">正在启动本地引擎…</div>
</body>
</html>
